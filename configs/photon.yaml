seed: 20260916
data:
  photon_files: [] # Set two ROOT paths; photon-1 and photon-2 files are grouped by source event id.
  output_dir: datasets/photon_v1
  ninja_roots: [] # Preferred training input: one mmap_ninja directory per photon source.
  max_events_per_split: null # Integer, or {train, val, test} limits for a deterministic bounded pilot.
  wsi_collection: ZDC_WSi_Hits
  sipm_collection: HcalFarForwardZDCHits
  rotation_theta_rad: 0.025
  audit_entries: 1000
  chunk_entries: 1000
  min_positive_energy: 0.0
split:
  train_fraction: 0.70
  val_fraction: 0.15
model:
  dim: 128
  layers: 6
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1
  max_tokens: 2048
  position_frequencies: 2
  input_normalization: layernorm # Raw token-feature LayerNorm; set none only for the ablation.
  event_summary: none # Set calorimeter to append train-normalized event sums/counts after token pooling.
training:
  epochs: 40
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  device: auto
evaluation:
  energy_bins_gev: [0.0, 5.0, 10.0, 15.0, 20.0, 30.0, 45.0, 65.0]
  min_fit_events: 200
