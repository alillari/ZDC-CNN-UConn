[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zdc-momentum"
version = "0.1.0"
description = "Reproducible sparse ZDC photon momentum regression"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "uproot", "awkward", "PyYAML", "scipy", "matplotlib"]

[project.scripts]
zdc = "zdc_momentum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
