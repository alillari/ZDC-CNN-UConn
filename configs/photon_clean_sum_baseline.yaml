# Arm 1: no neural network.  Fits the two raw detector energy sums on the
# selected training partition and evaluates the held-out test partition.
seed: 20260916
data:
  photon_files: []
  output_dir: datasets/photon_v1
  ninja_roots: [datasets/photon_ninja_v1/photon1, datasets/photon_ninja_v1/photon2]
  max_events_per_split: {train: 8192, val: 2048, test: 2048}
  wsi_collection: ZDC_WSi_Hits
  sipm_collection: HcalFarForwardZDCHits
  rotation_theta_rad: 0.025
  audit_entries: 1000
  chunk_entries: 1000
  min_positive_energy: 0.0
split: {train_fraction: 0.70, val_fraction: 0.15}
model: {max_tokens: null}
training: {device: cuda}
evaluation:
  energy_bins_gev: [0.0, 5.0, 10.0, 15.0, 20.0, 30.0, 45.0, 65.0]
  min_fit_events: 100
