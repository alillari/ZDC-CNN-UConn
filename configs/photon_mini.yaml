# Small, deterministic end-to-end sanity run.  It reads the full Ninja files
# but selects the same hash-ranked subset from each split on every invocation.
seed: 20260916
data:
  photon_files: []
  output_dir: datasets/photon_v1
  ninja_roots:
    - datasets/photon_ninja_v1/photon1
    - datasets/photon_ninja_v1/photon2
  max_events_per_split: 1024
  wsi_collection: ZDC_WSi_Hits
  sipm_collection: HcalFarForwardZDCHits
  rotation_theta_rad: 0.025
  audit_entries: 1000
  chunk_entries: 1000
  min_positive_energy: 0.0
split:
  train_fraction: 0.70
  val_fraction: 0.15
model:
  dim: 64
  layers: 2
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1
  max_tokens: 512
  position_frequencies: 2
  input_normalization: layernorm
  event_summary: none
training:
  epochs: 5
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  device: auto
evaluation:
  energy_bins_gev: [0.0, 5.0, 10.0, 15.0, 20.0, 30.0, 45.0, 65.0]
  min_fit_events: 100
